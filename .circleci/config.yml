version: 2
jobs:
  build:
    working_directory: /usr/src/redis
    docker:
      - image: nimlang/nim
      - image: redis:3
    steps:
      - checkout
      - run:
          name: test
          command: nim c -r tests/main.nim
      - run:
          name: test closed connection handling
          command: nim c -r tests/tclosedconn.nim
  build_alpine:
    working_directory: /usr/src/redis
    docker:
      - image: nimlang/nim:alpine
      - image: redis:3
    steps:
      - checkout
      - run:
          name: test
          command: nim c -r tests/main.nim
      - run:
          name: test closed connection handling
          command: nim c -r tests/tclosedconn.nim
workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - build_alpine
